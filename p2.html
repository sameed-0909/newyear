<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Pause Before 2025</title>

<!-- Elegant font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  font-family:'Playfair Display',serif;
  overflow:hidden;
  background:linear-gradient(120deg,#0f2027,#203a43,#2c5364);
  background-size:400% 400%;
  animation:bgFlow 15s ease infinite;
  color:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

@keyframes bgFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Stars */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:0.6;
  animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:0.2}
  50%{opacity:0.8}
}

.container{
  max-width:650px;
  padding:30px;
  z-index:2;
}

.line{
  font-size:clamp(1.3rem,4vw,1.7rem);
  margin-bottom:22px;
  opacity:0;
  filter:blur(6px);
  transform:translateY(30px);
  animation:reveal 1.2s ease forwards;
}

.line:nth-child(1){animation-delay:0.8s}
.line:nth-child(2){animation-delay:2s}
.line:nth-child(3){animation-delay:3.2s}

@keyframes reveal{
  to{
    opacity:1;
    filter:blur(0);
    transform:translateY(0);
  }
}

button{
  margin-top:40px;
  padding:16px 44px;
  border:none;
  border-radius:50px;
  font-size:1rem;
  font-family:inherit;
  cursor:pointer;
  background:rgba(255,255,255,0.9);
  color:#000;
  opacity:0;
  transform:translateY(20px);
  animation:reveal 1s ease forwards;
  animation-delay:4.6s;
}

button:hover{
  transform:scale(1.08);
}
</style>
</head>

<body>

<div class="container">
  <div class="line">The year tested you in ways no one saw.</div>
  <div class="line">Some days were heavy. Some nights were quiet.</div>
  <div class="line">But you’re still here — and that matters.</div>

  <a href="p3.html"><button onclick="goNext()">Continue →</button></a>
</div>

<script>
/* Stars generation */
for(let i=0;i<60;i++){
  const star=document.createElement("div");
  star.className="star";
  star.style.left=Math.random()*100+"vw";
  star.style.top=Math.random()*100+"vh";
  star.style.animationDelay=Math.random()*3+"s";
  document.body.appendChild(star);
}


</script>

</body>
</html>
