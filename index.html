<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 🎆</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(270deg,#ff0080,#7928ca,#00f5d4,#ffd166);
  background-size:600% 600%;
  animation:bgMove 12s ease infinite;
  color:white;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.hero{
  position:relative;
  z-index:5;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

h1{
  font-size:clamp(3rem,8vw,6rem);
  opacity:0;
  transform:scale(0.3) rotate(-10deg);
  text-shadow:0 0 20px rgba(255,255,255,0.6);
}

.show-text{
  opacity:1;
  animation:slam 1s cubic-bezier(.34,1.56,.64,1) forwards;
}

@keyframes slam{
  0%{transform:scale(0.3) rotate(-10deg)}
  60%{transform:scale(1.2) rotate(2deg)}
  100%{transform:scale(1) rotate(0)}
}

button{
  margin-top:35px;
  padding:16px 42px;
  font-size:1.1rem;
  border:none;
  border-radius:50px;
  cursor:pointer;
  background:linear-gradient(135deg,#fff,#ffd166);
  color:#000;
  opacity:0;
  transform:translateY(30px);
  transition:.4s;
}

.show-btn{
  opacity:1;
  transform:translateY(0);
}

button:hover{transform:scale(1.08)}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;
}

/* Confetti */
.confetti span{
  position:absolute;
  top:-10px;
  width:8px;
  height:14px;
  animation:fall linear infinite;
  opacity:0.9;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

/* Floating particles */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:.6;
  animation:float 8s linear infinite;
}

@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(-120vh)}
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>
<div class="confetti"></div>

<main class="hero">
  <h1 id="title">Happy New Year 🎉</h1>
  <a href="p2.html"><button id="next">Next →</button></a>
</main>

<script>
const title=document.getElementById("title");
const btn=document.getElementById("next");
const confettiBox=document.querySelector(".confetti");

// Reveal
setTimeout(()=>title.classList.add("show-text"),800);
setTimeout(()=>btn.classList.add("show-btn"),1600);

// Confetti
for(let i=0;i<120;i++){
  const c=document.createElement("span");
  c.style.left=Math.random()*100+"vw";
  c.style.background=`hsl(${Math.random()*360},100%,60%)`;
  c.style.animationDuration=3+Math.random()*4+"s";
  confettiBox.appendChild(c);
}

// Particles
for(let i=0;i<40;i++){
  const p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"vw";
  p.style.bottom="-20px";
  p.style.animationDuration=6+Math.random()*6+"s";
  document.body.appendChild(p);
}

// Fireworks
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

function burst(x,y){
  for(let i=0;i<80;i++){
    const a=Math.random()*Math.PI*2;
    const s=Math.random()*5;
    ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
    ctx.beginPath();
    ctx.arc(x+Math.cos(a)*s*i,y+Math.sin(a)*s*i,2,0,Math.PI*2);
    ctx.fill();
  }
}

setInterval(()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  burst(Math.random()*canvas.width,Math.random()*canvas.height/2);
},1200);

</script>

</body>
</html>
