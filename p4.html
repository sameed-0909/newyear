<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  font-family:'Nunito',sans-serif;
  background:#ffd6e8; /* Pink theme */
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  text-align:center;
  position:relative;
}

.like{

}

/* Background emojis */
.emoji{
  position:absolute;
  font-size:24px;
  user-select:none;
  pointer-events:none;
}

/* Floating PNG images */
.png-img{
  position:absolute;
  max-width:80px;
  pointer-events:none;
  animation:float 4s ease-in-out infinite alternate;
}

@keyframes float{
  0%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-15px) rotate(5deg);}
  100%{transform:translateY(0) rotate(-5deg);}
}

/* Central card */
.card{
  background:rgba(255,255,255,0.9);
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  text-align:center;
  opacity:0;
  transform:translateY(50px);
  transition:all 1s ease;
  z-index:5;
  max-width:90%;
}

.card.show{
  opacity:1;
  transform:translateY(0);
}

button{
  margin-top:15px;
  padding:12px 28px;
  border:none;
  border-radius:25px;
  font-size:1rem;
  cursor:pointer;
  background:linear-gradient(135deg,#ff85c1,#ff2d99);
  color:#fff;
  transition:.3s;
}

.like{
  margin-left: px;
}

button:hover{transform:scale(1.05);}
</style>
</head>
